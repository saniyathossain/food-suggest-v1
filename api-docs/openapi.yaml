openapi: 3.1.0
info:
  title: Pathya API
  version: 0.1.0
  summary: Diet, meal-timing and lifestyle guidance (Bangladesh first, English / Bangla).
  description: |
    Public reads are computed from one cached catalog snapshot (zero queries per page view) and answer in one
    language chosen by `lang`. Admin routes need `Authorization: Bearer <ADMIN_TOKEN>` (replaced by RBAC in the
    platform unit). Roles: super_admin, admin, editor, medical_reviewer (reviews, never publishes or edits), user.
    Errors are `{"error", "code"}` plus `fields` on 422; every response carries `x-request-id`.
    Guidance is general information, not medical advice.

    Lists: every list that can grow is cursor-paged (`limit`, `cursor` from the last page's `next_cursor`, `total`) or, for
    admin tables, page-numbered (`page`, `per_page` 10-100, default 25; answer `{ items, total, page, per_page }`). Sorting and
    filters are query parameters, never client logic, so a mobile app can page the same endpoints. JSON request bodies are
    cleaned on arrival: HTML tags, control characters and script URLs are stripped from every string (secret fields such as
    passwords and keys are left untouched).
servers:
  - url: http://127.0.0.1:8100
    description: Local Docker
tags:
  - name: system
  - name: catalog
  - name: plan
  - name: media
  - name: admin
paths:
  /api/v1/tiers:
    get: { summary: 'Tiers and what each includes (counts: -1 unlimited; switches 1/0)', responses: { '200': { description: Tiers } } }
  /api/v1/auth/register:
    post: { summary: Create an account and sign in (HttpOnly session cookie), requestBody: { content: { application/json: { schema: { type: object, required: [email, password, name], properties: { email: { type: string }, password: { type: string, minLength: 8, maxLength: 128 }, name: { type: string }, locale: { type: string, enum: [en, bn] } } } } } }, responses: { '201': { description: Me }, '422': { description: Field errors } } }
  /api/v1/auth/login:
    post: { summary: 'Sign in; 5 failures per email per 15 minutes, then 429', requestBody: { content: { application/json: { schema: { type: object, properties: { email: { type: string }, password: { type: string } } } } } }, responses: { '200': { description: Me (sets cookie) }, '422': { description: Wrong email or password }, '429': { description: Too many attempts } } }
  /api/v1/auth/logout:
    post: { summary: Sign out (clears cookie), responses: { '204': { description: Done } } }
  /api/v1/auth/me:
    get: { summary: The signed-in account with its tier and features, or null, responses: { '200': { description: Me or null } } }
  /api/v1/auth/forgot:
    post: { summary: Mail a one-hour reset link (always 204), responses: { '204': { description: Done } } }
  /api/v1/auth/reset:
    post: { summary: Set a new password with the link's token (ends all sessions), responses: { '204': { description: Done }, '422': { description: Expired token or bad password } } }
  /api/v1/me/profiles:
    get: { summary: 'Profiles (self and family) with conditions, allergies, allergens (closed list), surgeries, pregnancy, height_cm, waist_cm, activity, sleep_hours, budget, medicines, lab history', security: [{ session: [] }], responses: { '200': { description: Profiles } } }
    post: { summary: 'Add a profile (402 upgrade_required when the tier''s profile count is used)', security: [{ session: [] }], responses: { '201': { description: Saved }, '402': { description: Upgrade required } } }
  /api/v1/me/profiles/{id}:
    put: { summary: Save a profile and its conditions, security: [{ session: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: Saved } } }
    delete: { summary: Delete a profile, security: [{ session: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '204': { description: Deleted } } }
  /api/v1/me/profiles/{id}/labs:
    post: { summary: 'Add a dated lab value (tier: history)', security: [{ session: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '201': { description: Saved }, '402': { description: Upgrade required } } }
  /api/v1/me/profiles/{id}/medicines:
    post: { summary: 'Add a medicine as prescribed: brand, generic or typed name; dose in the person''s words (tier: medicines). The app never suggests a dose.', security: [{ session: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '201': { description: Saved }, '402': { description: Upgrade required } } }
  /api/v1/me/profiles/{id}/medicines/{row}:
    patch: { summary: 'Stop a medicine (dated, kept in history) or remove it (stopped_on null)', security: [{ session: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: integer } }, { name: row, in: path, required: true, schema: { type: integer } }], responses: { '204': { description: Done } } }
  /api/v1/me/profiles/{id}/meals:
    get:
      summary: 'A day of the meal log with totals against a typical adult''s limits (tier: meal_log)'
      description: 'Day defaults to today (Dhaka). Meters list limits first (kcal, sugar, sat_fat, sodium: stay under) then goals (protein, fibre, iron, calcium, potassium: reach). Nutrients a dataset does not report stay null and add nothing. 402 upgrade_required (feature meal_log) when the tier lacks it.'
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }, { name: date, in: query, schema: { type: string, example: '2026-11-23' } }, { $ref: '#/components/parameters/Lang' }]
      responses:
        '200':
          description: The day
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DayLog' }
              example: { date: '2026-11-23', profile_id: 1, entries: [{ id: 7, meal: lunch, grams: 250, note: '', food: rice, name: Rice, image: null, variant: null, nutrients: { kcal: 325.0, protein_g: 6.8, fat_g: null, carb_g: 70.0, fibre_g: null, sugar_g: 0.3, sat_fat_g: null, sodium_mg: null, potassium_mg: null, iron_mg: null, calcium_mg: null } }], meals: [{ meal: breakfast, entries: 0, kcal: 0.0 }, { meal: lunch, entries: 1, kcal: 325.0 }, { meal: snack, entries: 0, kcal: 0.0 }, { meal: dinner, entries: 0, kcal: 0.0 }], totals: { kcal: 325.0 }, meters: [{ key: kcal, kind: limit, unit: kcal, amount: 325.0, target: 2000.0, share: 0.16, over: false }], unreported: 0, note: 'Measured against a typical adult''s day (WHO and EU reference values). General guidance, not personal advice: your own needs differ.' }
        '402': { description: Upgrade required }
        '404': { description: Not your profile }
    post:
      summary: 'Log a food (tier: meal_log)'
      description: 'grams 1-3000; `eaten_on` defaults to today, may not be before 2020 or after tomorrow; `variant` is a variant slug of that food (the way it was cooked), absent = the usual form; at most 60 entries per profile per day.'
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MealInput' }
            example: { food: rice, variant: rice-boiled, grams: 250, meal: lunch, eaten_on: '2026-11-23' }
      responses: { '201': { description: 'Saved: { id }' }, '402': { description: Upgrade required }, '422': { description: Validation failed } }
  /api/v1/me/profiles/{id}/meals/range:
    get:
      summary: 'Days that have entries, each with totals and the limits it passed (tiers: meal_log and charts_pack)'
      description: 'Defaults to the last 30 days; at most 92 days, oldest first. Days with no entries are left out.'
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }, { name: from, in: query, schema: { type: string } }, { name: to, in: query, schema: { type: string } }]
      responses:
        '200':
          description: The range
          content:
            application/json:
              example: { from: '2026-10-25', to: '2026-11-23', days: [{ date: '2026-11-22', entries: 2, totals: { kcal: 780.0, sodium_mg: 3900.0 }, over: [sodium] }] }
        '402': { description: Upgrade required }
  /api/v1/me/profiles/{id}/meals/{entry}:
    delete: { summary: 'Remove a logged food (tier: meal_log)', security: [{ session: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: integer } }, { name: entry, in: path, required: true, schema: { type: integer } }], responses: { '204': { description: Removed }, '404': { description: Not found } } }
  /api/v1/me/plan:
    get: { summary: 'Personal plan for a profile: tier limits (conditions counted; only the eat-more list is cut, never avoid / go easy), meal alternatives, medicine–medicine and medicine–food checks with sources', security: [{ session: [] }], parameters: [{ name: profile, in: query, schema: { type: integer } }, { name: lang, in: query, schema: { type: string } }], responses: { '200': { description: Personal plan } } }
  /api/v1/me/profiles/{id}/report/weekly:
    get:
      summary: 'Seven days of the meal log in one page (tier: weekly_report)'
      description: 'The week ends on `to` (default today). `average` is the average LOGGED day against the reference (days with no entries are not counted as zero); `over_days` says on how many logged days each limit was passed; `top_foods` are the five heaviest in calories.'
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }, { name: to, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Lang' }]
      responses:
        '200':
          description: The week
          content:
            application/json:
              example: { profile_id: 7, from: '2026-11-17', to: '2026-11-23', logged_days: 2, average: [{ key: kcal, kind: limit, unit: kcal, amount: 227.5, target: 2000.0, share: 0.11, over: false }], days: [{ date: '2026-11-22', entries: 1, totals: { kcal: 130.0 }, over: [] }], over_days: [{ key: kcal, days: 0 }, { key: sodium, days: 0 }], top_foods: [{ food: white-rice, name: White rice (bhat), grams: 350, kcal: 455.0 }], note: 'Measured against a typical adult''s day (WHO and EU reference values). General guidance, not personal advice: your own needs differ.' }
        '402': { description: 'Upgrade required (feature weekly_report)' }
  /api/v1/me/profiles/{id}/shares:
    get: { summary: 'Accounts this profile is shared with (owner only)', security: [{ session: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: 'Rows { user_id, name, email }' } } }
    post:
      summary: 'Share a profile, read only, with another account by its email (tier: family_sharing)'
      description: 'Up to 5 accounts per profile. The other account must already exist (422 says so). Removing the share ends access at once. Note: the 422 for an unknown email tells the owner that no account has it.'
      security: [{ session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string } } }, example: { email: 'amma@example.com' } } } }
      responses: { '201': { description: 'The account: { user_id, name, email }' }, '402': { description: 'Upgrade required (feature family_sharing)' }, '422': { description: Validation failed } }
  /api/v1/me/profiles/{id}/shares/{user}:
    delete: { summary: 'Stop sharing a profile with an account', security: [{ session: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: integer } }, { name: user, in: path, required: true, schema: { type: integer } }], responses: { '204': { description: Done } } }
  /api/v1/me/shared:
    get: { summary: 'Profiles other people shared with me (read only)', security: [{ session: [] }], responses: { '200': { description: 'Rows { id, name, relation, owner }' } } }
  /api/v1/me/shared/{id}/plan:
    get: { summary: 'The plan of a shared profile, built under the OWNER''s tier', security: [{ session: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: Personal plan }, '404': { description: Not shared with you } } }
  /api/v1/me/export:
    get:
      summary: 'Download everything the account holds about its own people as JSON (tier: data_export)'
      description: 'Profiles with conditions, medicines and lab history, and every meal-log entry. Sent as an attachment named pathya-export.json.'
      security: [{ session: [] }]
      responses: { '200': { description: 'ExportDto: { generated_on, email, profiles[], meals[] }' }, '402': { description: 'Upgrade required (feature data_export)' } }
  /api/v1/search-index:
    get: { summary: 'What the in-app search can find, by the viewer''s tier (one language, private cache)', description: 'The `spotlight` tier feature sets how far the search reaches: level 1 returns no habits or medicines (pages and foods only), level 2 adds habits, level 3 (or unlimited) adds medicines; the answer carries `level` so a client can show what an upgrade would add. The app fetches this once when the search opens and filters it locally. Habits of conditions that are not live yet are left out.', parameters: [{ $ref: '#/components/parameters/Lang' }], responses: { '200': { description: 'SearchIndexDto: { habits[], medicines[{ slug, name, group }] }' } } }
  /api/v1/medicines/search:
    get: { summary: Brands starting with q and generics containing q (2+ letters), security: [{ session: [] }], parameters: [{ name: q, in: query, schema: { type: string } }], responses: { '200': { description: Hits } } }
  /api/v1/library/medicines:
    get:
      summary: 'Medicine library: filtered, sorted, cursor-paged (public, one language, cacheable)'
      description: 'Filters q (name or group), group (slugs, comma separated), timing (empty_stomach, before_food, with_food, after_food, any; comma separated). sort: az (default), za, conflicts (food notes plus medicine conflicts), food_notes, drug_conflicts, group, timing. cursor is the previous page''s next_cursor; limit 1-60 (24). The answer also carries `groups` (every group with how many medicines choosing it would show, zero included) and `timings` (the same for each way of taking it), so a client can draw live counts without another call. Each card has `image` (media-library photo or null).'
      parameters:
        - { name: lang, in: query, schema: { type: string, enum: [en, bn] } }
        - { name: q, in: query, schema: { type: string } }
        - { name: group, in: query, schema: { type: string } }
        - { name: timing, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [az, za, conflicts, food_notes, drug_conflicts, group, timing] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 60 } }
      responses: { '200': { description: 'MedicinePageDto: { items[MedicineCardDto], next_cursor, total, groups[], timings[] }' } }
  /api/v1/links:
    get:
      summary: 'What is linked to X: foods, conditions, medicines, allergens and readings, cursor-paged (public, one language, cacheable)'
      description: 'from is required: kind:key, such as food:rice, condition:diabetes, medicine:metformin, allergen:gluten, criterion:blood_pressure:high (a reading''s band) or criterion:age:senior / criterion:sex:female / criterion:pregnancy:pregnant. to narrows the other end by kind (food, condition, medicine, allergen, criterion; several with | or ,). verdict narrows by recommended, ok, limit, avoid, caution, serious (several allowed). q matches words in the other end''s name (either language), group or key. Rows are read from the tables the plan already uses (food rules, medicine food notes, medicine conflicts, allergens, reading notes, age and sex notes) plus the links table; when several join the same pair the stricter verdict wins (serious > avoid > caution > limit > recommended > ok) and `merged` counts the rest. Order: strictest first, then kind, then name. cursor is the previous page''s next_cursor; limit 1-60 (24). The answer carries `counts` per kind before the `to` filter so a client can draw live chips. An allergen or a criterion has no label here: the app words it. Every reason is general guidance with its source, never a diagnosis or a dose.'
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, example: 'food:rice' } }
        - { name: to, in: query, schema: { type: string, example: 'condition|medicine' } }
        - { name: verdict, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 60 } }
        - { name: lang, in: query, schema: { type: string, enum: [en, bn] } }
      responses: { '200': { description: 'LinksPageDto: { from: LinkEndDto, items[LinkDto { id, other: LinkEndDto { kind, key, label, hint }, verdict, reason, source, origin, merged }], next_cursor, total, counts[{ kind, count }] }' }, '404': { description: Unknown or inactive subject }, '422': { description: 'Field errors: from, to, verdict or cursor' } }
  /api/v1/admin/links:
    get:
      summary: 'Every link, both ends and both languages, by page number (editor and up)'
      description: 'Same filters as /api/v1/links but from is optional (it then matches either end, and to matches either end''s kind); page from 0 and per_page 10-100 (25). Inactive foods, conditions and medicines are included. Each row has `editable` (false for reading and age or sex notes, which are edited elsewhere) and `origin`. The answer carries `counts` and `criteria`, the closed list of keys a criterion may take.'
      security: [{ admin: [] }, { session: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
        - { name: verdict, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 0 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 10, maximum: 100 } }
        - { name: lang, in: query, schema: { type: string, enum: [en, bn] } }
      responses: { '200': { description: 'AdminLinksPageDto: { items[AdminLinkDto], total, page, per_page, counts[], criteria[] }' } }
    post:
      summary: 'Add a link (editor)'
      description: 'Body { first: { kind, key }, second: { kind, key }, verdict, reason: { en, bn }, source? (a source key) }. The link is written to the table that holds that kind of pair, so the plan and the links never disagree: food and condition go to the food rules (avoid, limit, ok or recommended), food and allergen to the allergen list (avoid; no words needed), medicine and food to the medicine food notes (caution or serious), two medicines to the medicine conflicts (caution or serious); every other pair goes to the links table. Both ends must exist and differ. Answer { id } (link:12, rule:55, medfood:7:rice …).'
      security: [{ admin: [] }, { session: [] }]
      requestBody: { content: { application/json: { schema: { type: object, required: [first, second, verdict, reason], properties: { first: { type: object, properties: { kind: { type: string, enum: [food, condition, medicine, allergen, criterion] }, key: { type: string } } }, second: { type: object, properties: { kind: { type: string, enum: [food, condition, medicine, allergen, criterion] }, key: { type: string } } }, verdict: { type: string, enum: [recommended, ok, limit, avoid, caution, serious] }, reason: { type: object, properties: { en: { type: string }, bn: { type: string } } }, source: { type: string } } } } } }
      responses: { '201': { description: LinkSavedDto }, '422': { description: 'Field errors: a verdict the pair does not take, an end that is not there, a pair already linked' } }
  /api/v1/admin/links/{id}:
    patch:
      summary: 'Change a link''s verdict, reason, source (null removes it) or on/off (editor)'
      description: 'id comes from the list: link:12, rule:55, medfood:7:rice, medpair:3, allergen:rice:gluten. A food rule edit asks for review again. A medicine food note holds severity, advice and source for every food it lists. An allergen link is added or deleted, not edited; reading and age or sex notes are read-only here (422).'
      security: [{ admin: [] }, { session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { verdict: { type: string, enum: [recommended, ok, limit, avoid, caution, serious] }, reason: { type: object, properties: { en: { type: string }, bn: { type: string } } }, source: { type: string, nullable: true }, active: { type: boolean } } } } } }
      responses: { '200': { description: LinkSavedDto }, '404': { description: Unknown link }, '422': { description: Field errors or read-only row } }
    delete:
      summary: 'Delete a link (editor)'
      description: 'A medicine food note made for one food goes with it; a note that lists several foods keeps the others.'
      security: [{ admin: [] }, { session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: Deleted }, '404': { description: Unknown link }, '422': { description: Read-only row } }
  /api/v1/library/medicines/{slug}:
    get:
      summary: 'One medicine: how it is taken, photo, food notes, medicine conflicts, brands, same-group medicines'
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, schema: { type: string, enum: [en, bn] } }
      responses: { '200': { description: MedicineDetailDto }, '404': { description: Unknown medicine } }
  /api/v1/admin/options/{kind}:
    get:
      summary: 'Picker options from the catalogue, searched on the server and cursor-paged (editor and up)'
      description: 'kind: foods, conditions, medicines or tiers. q matches both languages and the slug (names that start with q first); cursor is the previous page''s next_cursor; limit 1-50 (20); value=<slug> returns just that one option, to learn the label of a stored choice. Answer: { items[{ value, label, hint }], next_cursor, total }.'
      security: [{ admin: [] }, { session: [] }]
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [foods, conditions, medicines, tiers] } }
        - { name: q, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
        - { name: value, in: query, schema: { type: string } }
        - { name: lang, in: query, schema: { type: string, enum: [en, bn] } }
      responses: { '200': { description: OptionsPageDto }, '404': { description: Unknown kind } }
  /api/v1/admin/counts:
    get: { summary: 'Row counts for the admin sidebar: accounts, payments waiting for review, gateways, audit entries, media (editor and up)', security: [{ admin: [] }, { session: [] }], responses: { '200': { description: 'SectionCountsDto' } } }
  /api/v1/admin/foods/{slug}:
    patch: { summary: 'Change a food: name (both languages), category slug, active (off hides it from the public site) (editor)', security: [{ admin: [] }, { session: [] }], parameters: [{ name: slug, in: path, required: true, schema: { type: string } }], requestBody: { content: { application/json: { schema: { type: object, properties: { name: { type: object, properties: { en: { type: string }, bn: { type: string } } }, category: { type: string }, active: { type: boolean } } } } } }, responses: { '200': { description: Saved }, '404': { description: Unknown food }, '422': { description: Field errors } } }
    delete: { summary: 'Delete a food; its rules, variants, photos, nutrition and meal-log rows go with it (admin)', security: [{ admin: [] }, { session: [] }], parameters: [{ name: slug, in: path, required: true, schema: { type: string } }], responses: { '204': { description: Deleted }, '404': { description: Unknown food } } }
  /api/v1/admin/generics/{slug}/media:
    patch: { summary: 'Give a medicine a photo from the media library; media_id 0 clears it (editor)', security: [{ admin: [] }, { session: [] }], parameters: [{ name: slug, in: path, required: true, schema: { type: string } }], requestBody: { content: { application/json: { schema: { type: object, required: [media_id], properties: { media_id: { type: integer } } } } } }, responses: { '200': { description: Saved }, '404': { description: Unknown medicine } } }
  /api/v1/recipes:
    get:
      summary: Published recipes (filters q, kind, food, condition = not "avoid" for it); each with its fit per condition
      parameters:
        - { name: lang, in: query, schema: { type: string, enum: [en, bn] } }
        - { name: q, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [main, side, breakfast, snack, drink] } }
        - { name: food, in: query, schema: { type: string } }
        - { name: condition, in: query, schema: { type: string } }
      responses: { '200': { description: Recipe cards } }
  /api/v1/recipes/{slug}:
    get:
      summary: A recipe with ingredients (catalogue foods linked), steps, tips, fit
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }, { name: lang, in: query, schema: { type: string } }]
      responses: { '200': { description: Recipe }, '404': { description: Unknown or hidden } }
  /api/v1/posts:
    get:
      summary: Published articles, newest first (filter tag)
      parameters: [{ name: lang, in: query, schema: { type: string } }, { name: tag, in: query, schema: { type: string } }]
      responses: { '200': { description: Article cards } }
  /api/v1/posts/{slug}:
    get:
      summary: An article (body lines, sources)
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }, { name: lang, in: query, schema: { type: string } }]
      responses: { '200': { description: Article }, '404': { description: Unknown or hidden } }
  /api/v1/admin/conditions/{slug}/review:
    post:
      summary: 'Mark a condition and all its rules reviewed (medical reviewer, admin or super admin, never an editor; needs a named account, never the shared token)'
      description: 'Refused (422) while any rule cites nothing (no source of its own and the condition has none). A condition goes live only after this: PATCH /admin/conditions/{slug} with active true is refused for a condition that is unreviewed or has a rule edited after its review.'
      security: [{ admin: [] }, { session: [] }]
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: 'ReviewDto: { subject, rules_marked, reviewed_on }' }, '403': { description: 'Role may not review' }, '422': { description: Validation failed } }
  /api/v1/admin/food-rules/{id}/review:
    post: { summary: 'Mark one rule reviewed (it must be cited)', security: [{ admin: [] }, { session: [] }], parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: ReviewDto }, '422': { description: 'No source' } } }
  /api/v1/admin/food-rules/bulk:
    post:
      summary: 'One verdict for many foods of a condition (editor)'
      description: 'Foods with a rule keep their reason unless a new one is sent; a food with no rule needs a reason. An edited rule has to be reviewed again.'
      security: [{ admin: [] }, { session: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [condition, foods, verdict], properties: { condition: { type: string }, foods: { type: array, items: { type: string }, maxItems: 500 }, verdict: { $ref: '#/components/schemas/Verdict' }, reason: { $ref: '#/components/schemas/Text' }, source: { type: string } } }, example: { condition: pcos, foods: [maida, biscuits], verdict: limit, reason: { en: Refined flour has less fibre., bn: '' }, source: nhs-pmos } } } }
      responses: { '200': { description: 'RuleBulkResultDto: { created, updated, skipped[{ row, message }] }' } }
  /api/v1/admin/food-rules/export:
    get: { summary: 'Rules as CSV or JSON (any staff role)', description: 'Columns: condition, food, verdict, reason_en, reason_bn, source (key), reviewed_on. Cells starting with = + - @ are prefixed with an apostrophe so a spreadsheet never runs them.', security: [{ admin: [] }, { session: [] }], parameters: [{ name: condition, in: query, schema: { type: string } }, { name: format, in: query, schema: { type: string, enum: [csv, json], default: csv } }], responses: { '200': { description: 'The file, as an attachment' } } }
  /api/v1/admin/food-rules/import:
    post:
      summary: 'Import rules from CSV or JSON (editor); dry_run only checks'
      description: 'At most 2000 rules and 2 MB. CSV header: condition,food,verdict,reason_en (required) and reason_bn,source. Refused rows come back with their row number; the good ones are saved. A rule changed by an import has to be reviewed again.'
      security: [{ admin: [] }, { session: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [format, data], properties: { format: { type: string, enum: [csv, json] }, data: { type: string }, dry_run: { type: boolean } } }, example: { format: csv, dry_run: true, data: "condition,food,verdict,reason_en,reason_bn,source\ngout,egg,ok,Fine in moderation,,nhs-gout" } } } }
      responses: { '200': { description: 'RuleImportResultDto: { rows, created, updated, rejected[{ row, message }], dry_run }' } }
  /api/v1/admin/coverage:
    get: { summary: 'Rules coverage per condition (any staff role)', description: 'rules by verdict, foods with no rule (uncovered + a sample), uncited and unreviewed rules, timing/habit/source counts, reviewed_on, whether it can ship and what blocks it.', security: [{ admin: [] }, { session: [] }], responses: { '200': { description: 'CoverageDto: { foods, conditions[] }' } } }
  /api/v1/admin/users:
    get: { summary: 'Accounts, page-numbered (editor and up): filters q, role, tier', security: [{ admin: [] }, { session: [] }], parameters: [{ name: page, in: query, schema: { type: integer, minimum: 0 } }, { name: per_page, in: query, description: '10-100, default 25', schema: { type: integer, minimum: 10, maximum: 100 } }, { name: q, in: query, schema: { type: string } }, { name: role, in: query, schema: { type: string } }, { name: tier, in: query, schema: { type: string } }], responses: { '200': { description: 'PageDto<UserAdminDto>: { items, total, page, per_page }' } } }
  /api/v1/admin/payments:
    get: { summary: 'Payments, page-numbered (admin): filters status, gateway, q', security: [{ admin: [] }, { session: [] }], parameters: [{ name: page, in: query, schema: { type: integer, minimum: 0 } }, { name: per_page, in: query, description: '10-100, default 25', schema: { type: integer, minimum: 10, maximum: 100 } }, { name: q, in: query, schema: { type: string } }, { name: status, in: query, schema: { type: string } }, { name: gateway, in: query, schema: { type: string } }], responses: { '200': { description: 'PageDto<PaymentAdminDto>' } } }
  /api/v1/admin/medicines:
    get: { summary: 'Medicine brands sold in Bangladesh, page-numbered (editor and up): filters q, generic', security: [{ admin: [] }, { session: [] }], parameters: [{ name: page, in: query, schema: { type: integer, minimum: 0 } }, { name: per_page, in: query, description: '10-100, default 25', schema: { type: integer, minimum: 10, maximum: 100 } }, { name: q, in: query, schema: { type: string } }, { name: generic, in: query, schema: { type: string } }], responses: { '200': { description: 'PageDto<MedicineAdminDto>' } } }
  /api/v1/admin/generics:
    get: { summary: 'Generic medicines with conflict counts, label sync date and photo (editor and up)', security: [{ admin: [] }, { session: [] }], responses: { '200': { description: 'GenericAdminDto[] (media_id, image)' } } }
  /api/v1/admin/audit:
    get: { summary: 'Audit trail, newest first (admin)', description: 'page, per_page (10-100, default 25). `action` matches the start of the action name (rule., condition., tier., post.published, rules.imported…); `q` matches the subject or the actor email.', security: [{ admin: [] }, { session: [] }], parameters: [{ name: action, in: query, schema: { type: string } }, { name: q, in: query, schema: { type: string } }, { name: page, in: query, schema: { type: integer } }], responses: { '200': { description: 'Page of { id, at, who, action, subject, detail }' } } }
  /api/v1/admin/calendar:
    get: { summary: 'Articles and recipes by day: published, scheduled or draft (editor)', security: [{ admin: [] }, { session: [] }], responses: { '200': { description: 'Rows { kind, slug, title_en, title_bn, date, state }' } } }
  /api/v1/admin/tiers/{slug}/preview:
    post:
      summary: 'What saving these feature values would change for a tier (admin); saves nothing'
      security: [{ admin: [] }, { session: [] }]
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { example: { features: [{ feature: meal_log, value: 1 }, { feature: profiles, value: 8 }] } } } }
      responses: { '200': { description: 'TierPreviewDto: { tier, accounts, changes[{ feature, before, after }], gains[], losses[] }. Editing the tier itself is PATCH /admin/tiers/{slug}, super admin only; it applies to every account on the tier at once.' } }
  /api/v1/admin/media/usage:
    get: { summary: 'Media library usage (editor)', description: 'total, used, unused, bytes, bytes by source, and the first 60 unused items.', security: [{ admin: [] }, { session: [] }], responses: { '200': { description: MediaUsageDto } } }
  /api/v1/admin/traffic:
    get: { summary: 'Hits per day and the busiest routes, last 30 days (admin)', description: 'Counted per day and route group only (page: first segment; api: first three segments). No user, address, agent or query is stored. Counts are flushed to the database every five minutes and before this call.', security: [{ admin: [] }, { session: [] }], responses: { '200': { description: 'TrafficDto: { days[{ day, count }], routes[{ route, hits }], total }' } } }
  /api/v1/admin/plan-mix:
    get: { summary: 'Accounts per tier (valid and lapsed) and role, signups per day, paid revenue per month (admin)', security: [{ admin: [] }, { session: [] }], responses: { '200': { description: PlanMixDto } } }
  /api/v1/admin/recipes:
    get: { summary: All recipes with publish state, security: [{ bearer: [] }], responses: { '200': { description: Rows } } }
  /api/v1/admin/recipes/{slug}:
    patch: { summary: 'Publish or hide a recipe; publish_on (YYYY-MM-DD, empty clears) schedules it: the catalogue flips it live when the day comes (editor)', security: [{ bearer: [] }], parameters: [{ name: slug, in: path, required: true, schema: { type: string } }], requestBody: { content: { application/json: { schema: { type: object, properties: { published: { type: boolean } } } } } }, responses: { '200': { description: Saved } } }
    delete: { summary: 'Delete a recipe (admin)', security: [{ bearer: [] }], parameters: [{ name: slug, in: path, required: true, schema: { type: string } }], responses: { '204': { description: Deleted }, '404': { description: Unknown } } }
  /api/v1/admin/posts:
    get: { summary: All articles with publish state, security: [{ bearer: [] }], responses: { '200': { description: Rows } } }
  /api/v1/admin/posts/{slug}:
    patch: { summary: 'Publish or hide an article; publish_on (YYYY-MM-DD, empty clears) schedules it: the catalogue flips it live when the day comes (editor)', security: [{ bearer: [] }], parameters: [{ name: slug, in: path, required: true, schema: { type: string } }], requestBody: { content: { application/json: { schema: { type: object, properties: { published: { type: boolean } } } } } }, responses: { '200': { description: Saved } } }
    delete: { summary: 'Delete a article (admin)', security: [{ bearer: [] }], parameters: [{ name: slug, in: path, required: true, schema: { type: string } }], responses: { '204': { description: Deleted }, '404': { description: Unknown } } }
  /api/v1/modes/{slug}:
    get:
      summary: A diet mode (everyday, ramadan, intermittent-16-8) with its meals, tips and how each condition fits it
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, schema: { type: string, enum: [en, bn] } }
      responses:
        '200': { description: The mode, content: { application/json: { schema: { $ref: '#/components/schemas/DietMode' } } } }
        '404': { description: Unknown or switched off }
  /api/v1/admin/modes:
    get:
      summary: Every diet mode (on and off) with counts
      security: [{ bearer: [] }]
      responses: { '200': { description: Rows } }
  /api/v1/admin/modes/{slug}:
    patch:
      summary: Switch a diet mode on or off, or move it
      security: [{ bearer: [] }]
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { active: { type: boolean }, sort: { type: integer } } } } } }
      responses: { '200': { description: Saved } }
  /api/v1/health:
    get:
      tags: [system]
      summary: Liveness + active drivers
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503': { description: Database unreachable }
  /api/v1/bootstrap:
    get:
      tags: [catalog]
      summary: Everything the home screen needs (small)
      parameters: [{ $ref: '#/components/parameters/Lang' }]
      responses:
        '200':
          description: Countries, conditions with counts, categories, meal slots, closed lists
          headers: { Cache-Control: { schema: { type: string, example: 'public, max-age=60, stale-while-revalidate=600' } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bootstrap' }
  /api/v1/conditions/{slug}:
    get:
      tags: [catalog]
      summary: One condition — food lanes, timing, habits
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, example: diabetes } }
        - { $ref: '#/components/parameters/Lang' }
      responses:
        '200':
          description: Condition detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConditionDetail' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/foods:
    get:
      tags: [catalog]
      summary: Search foods (English or Bangla) with the verdict per condition
      parameters:
        - { name: q, in: query, schema: { type: string, example: ilish } }
        - { name: category, in: query, schema: { type: string, example: proteins } }
        - { name: season, in: query, description: 'now = only foods in season this month (Dhaka time)', schema: { type: string, enum: [now] } }
        - { $ref: '#/components/parameters/Lang' }
      responses:
        '200':
          description: Up to 80 foods
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/FoodSearch' } }
  /api/v1/foods/{slug}:
    get:
      tags: [catalog]
      summary: 'One food: verdict per condition, food types with nutrients per 100 g (USDA-cited), season, meals, swaps, sources'
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, example: chicken } }
        - { $ref: '#/components/parameters/Lang' }
      responses:
        '200': { description: Food detail, content: { application/json: { schema: { $ref: '#/components/schemas/FoodDetail' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /readyz:
    get:
      tags: [system]
      summary: 'Readiness: database (critical), cache, storage; 503 when a critical dependency is down (drives the outage screen)'
      responses:
        '200': { description: Ready }
        '503': { description: Not ready }
  /robots.txt:
    get: { tags: [system], summary: Crawler rules and sitemap link, responses: { '200': { description: text/plain } } }
  /sitemap.xml:
    get: { tags: [system], summary: 'Every page, condition and food with en/bn alternates', responses: { '200': { description: application/xml } } }
  /api/v1/plan:
    post:
      tags: [plan]
      summary: Merge a profile's conditions into one day plan (strictest verdict wins)
      parameters: [{ $ref: '#/components/parameters/Lang' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanRequest' }
      responses:
        '200':
          description: Merged plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '422': { $ref: '#/components/responses/Error' }
  /media/{id}:
    get:
      tags: [media]
      summary: Media-library image, nearest stored WebP/JPEG variant from the storage disk (S3/MinIO)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: w, in: query, description: 'Wanted width (16-2400), nearest stored variant at least w', schema: { type: integer, example: 960 } }
      responses:
        '200':
          description: 'Image bytes, Cache-Control public, max-age=31536000, immutable'
          content: { image/webp: {}, image/jpeg: {} }
        '307': { description: 'Not yet in storage, redirect to the source CDN' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/admin/catalog:
    get:
      tags: [admin]
      security: [{ admin: [] }]
      summary: Raw catalog, both languages, inactive rows included (flushes the cache)
      responses:
        '200': { description: CatalogSnapshot }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/admin/food-rules:
    put:
      tags: [admin]
      security: [{ admin: [] }]
      summary: Create or update the rule for (condition, food)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleUpsert' }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Saved' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/admin/food-rules/{id}:
    delete:
      tags: [admin]
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/admin/foods:
    post:
      tags: [admin]
      security: [{ admin: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FoodCreate' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Saved' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/admin/conditions/{slug}:
    patch:
      tags: [admin]
      security: [{ admin: [] }]
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConditionPatch' }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Saved' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/admin/media:
    get:
      tags: [admin, media]
      security: [{ admin: [] }]
      summary: Media library, newest first
      responses:
        '200':
          description: Items
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Media' } }
    post:
      tags: [admin, media]
      security: [{ admin: [] }]
      summary: Import an image by URL (images.pexels.com, images.unsplash.com) into storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                alt: { $ref: '#/components/schemas/Text' }
      responses:
        '201': { description: Imported, content: { application/json: { schema: { $ref: '#/components/schemas/Media' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/admin/media/upload:
    post:
      tags: [admin, media]
      security: [{ admin: [] }]
      summary: 'Dropzone upload: JPEG/PNG/WebP up to 10 MB and 6000 px; stored as WebP 32/160/480/960/1600, transparency kept'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                alt_en: { type: string }
                alt_bn: { type: string }
      responses:
        '201': { description: Stored, content: { application/json: { schema: { $ref: '#/components/schemas/Media' } } } }
        '413': { description: Body over the limit }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/admin/media/{id}:
    delete:
      tags: [admin, media]
      security: [{ admin: [] }]
      summary: Delete an item and its files; covers using it fall back to a gradient
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/admin/cache:
    delete:
      tags: [admin]
      security: [{ admin: [] }]
      summary: Flush the catalog cache
      responses:
        '204': { description: Flushed }
  /api/v1/admin/sync-sources:
    get:
      tags: [admin]
      security: [{ admin: [] }]
      summary: 'External sync sources (super admin). Secret header values are never returned; vault_ready is false when APP_KEY is not set.'
      responses: { '200': { description: Sources, content: { application/json: { schema: { $ref: '#/components/schemas/SyncSetup' } } } }, '403': { $ref: '#/components/responses/Error' } }
    post:
      tags: [admin]
      security: [{ admin: [] }]
      summary: 'Add a source (super admin). slug, name, kind and base_url are required. Secret header values are sealed with APP_KEY.'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SyncSourceInput' } } } }
      responses: { '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/SyncSource' } } } }, '422': { $ref: '#/components/responses/Error' } }
  /api/v1/admin/sync-sources/test:
    post:
      tags: [admin]
      security: [{ admin: [] }]
      summary: 'One fetch with the settings sent (no retries, nothing saved). Send the slug of a saved source to reuse its stored secret headers.'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SyncSourceInput' } } } }
      responses: { '200': { description: What was read, content: { application/json: { schema: { $ref: '#/components/schemas/SyncTest' } } } }, '422': { $ref: '#/components/responses/Error' } }
  /api/v1/admin/sync-sources/{slug}:
    patch:
      tags: [admin]
      security: [{ admin: [] }]
      summary: 'Change a source (super admin); only what is sent changes. headers replaces the list; a secret header with an empty value keeps the stored one. schedule_hours null = by hand.'
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SyncSourceInput' } } } }
      responses: { '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/SyncSource' } } } }, '404': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
    delete:
      tags: [admin]
      security: [{ admin: [] }]
      summary: 'Delete a source and its runs (super admin). Rows it already saved stay.'
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: Deleted }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/admin/sync-sources/{slug}/run:
    post:
      tags: [admin]
      security: [{ admin: [] }]
      summary: 'Run a source now (super admin). Retries timeouts, connection errors, 429 and 5xx with exponential backoff; never other 4xx. Answers the finished run (status ok or failed). 422 when it is already running.'
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: The run, content: { application/json: { schema: { $ref: '#/components/schemas/SyncRun' } } } }, '404': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /api/v1/admin/sync-runs:
    get:
      tags: [admin]
      security: [{ admin: [] }]
      summary: 'Runs history, newest first (super admin)'
      parameters:
        - { name: source, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [running, ok, failed] } }
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 0 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 10, maximum: 100 } }
      responses: { '200': { description: A page of runs, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/SyncRun' } }, total: { type: integer }, page: { type: integer }, per_page: { type: integer } } } } } } }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: pathya_session }
    admin: { type: http, scheme: bearer, description: 'ADMIN_TOKEN from docker/.envs/app.env, at least 16 chars' }
  parameters:
    Lang:
      name: lang
      in: query
      schema: { type: string, enum: [en, bn], default: en }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            required: [error, code]
            properties:
              error: { type: string }
              code: { type: string, enum: [not_found, unauthorized, validation_failed, server_error] }
              fields: { type: object, additionalProperties: { type: string } }
  schemas:
    DietMode:
      type: object
      properties:
        slug: { type: string }
        kind: { type: string, enum: [general, religious_fast, time_restricted] }
        name: { type: string }
        summary: { type: string }
        window: { type: [string, 'null'] }
        slots: { type: array, items: { type: object, properties: { slug: { type: string }, name: { type: string }, time: { type: [string, 'null'] }, moment: { type: string }, note: { type: string } } } }
        tips: { type: array, items: { type: object, properties: { kind: { type: string, enum: [do, dont, safety, order] }, text: { type: string }, source: { type: [object, 'null'] } } } }
        conditions: { type: array, items: { type: object, properties: { condition: { type: object }, stance: { type: string, enum: [suits, caution, doctor_first] }, reason: { type: string }, source: { type: [object, 'null'] } } } }
    Glycemic:
      type: object
      description: From a published GI table; load = GI x (carbohydrate - fibre) / 100 per 100 g
      properties:
        gi: { type: integer }
        band: { type: string, enum: [low, medium, high] }
        available_carb_g: { type: [number, 'null'] }
        load_per_100g: { type: [number, 'null'] }
        load_band: { type: [string, 'null'], enum: [low, medium, high, null] }
        source: { type: [object, 'null'] }
    MealInput:
      type: object
      required: [food, grams, meal]
      properties:
        food: { type: string, description: Food slug }
        variant: { type: string, description: 'Variant slug of that food (how it was cooked)' }
        grams: { type: integer, minimum: 1, maximum: 3000 }
        eaten_on: { type: string, description: 'YYYY-MM-DD, default today' }
        meal: { type: string, enum: [breakfast, lunch, snack, dinner] }
        note: { type: string, maxLength: 200 }
    Meter:
      type: object
      properties:
        key: { type: string, enum: [kcal, sugar, sat_fat, sodium, protein, fibre, iron, calcium, potassium] }
        kind: { type: string, enum: [limit, goal] }
        unit: { type: string }
        amount: { type: number }
        target: { type: number }
        share: { type: number, description: amount / target }
        over: { type: boolean, description: 'A limit that is passed (never true for a goal)' }
    DayLog:
      type: object
      properties:
        date: { type: string }
        profile_id: { type: integer }
        entries: { type: array, items: { type: object } }
        meals: { type: array, items: { type: object, properties: { meal: { type: string }, entries: { type: integer }, kcal: { type: number } } } }
        totals: { type: object }
        meters: { type: array, items: { $ref: '#/components/schemas/Meter' } }
        unreported: { type: integer, description: Entries whose food has no calorie figure }
        note: { type: string }
    Verdict: { type: string, enum: [avoid, limit, ok, recommended] }
    Gender: { type: string, enum: [male, female, other] }
    AgeGroup: { type: string, enum: [child, teen, adult, senior] }
    Text:
      type: object
      required: [en]
      properties: { en: { type: string }, bn: { type: string } }
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: boolean }
        cache: { type: string, enum: [memory, redis, 'null'] }
        storage: { type: string, enum: [local, s3] }
        version: { type: string }
    ConditionTag:
      type: object
      properties: { slug: { type: string }, name: { type: string }, icon: { type: string }, color: { type: string } }
    Bootstrap:
      type: object
      properties:
        locale: { type: string }
        countries: { type: array, items: { type: object, properties: { code: { type: string }, name: { type: string } } } }
        conditions:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/ConditionTag'
              - type: object
                properties:
                  image: { type: [string, 'null'], example: /media/12 }
                  summary: { type: string }
                  counts: { type: object, additionalProperties: { type: integer } }
        categories: { type: array, items: { type: object, properties: { slug: { type: string }, name: { type: string }, image: { type: [string, 'null'] } } } }
        meal_slots:
          type: array
          items:
            type: object
            properties: { country: { type: string }, slug: { type: string }, name: { type: string }, time: { type: string }, image: { type: [string, 'null'] }, cutout: { type: [string, 'null'], description: 'the same food as a transparent image (no background)' } }
        age_groups: { type: array, items: { $ref: '#/components/schemas/AgeGroup' } }
        genders: { type: array, items: { $ref: '#/components/schemas/Gender' } }
        verdicts: { type: array, items: { $ref: '#/components/schemas/Verdict' } }
    FoodItem:
      type: object
      properties: { slug: { type: string }, name: { type: string }, image: { type: [string, 'null'], description: 'Own photo, else category cover' }, category: { type: string }, reason: { type: string } }
    Timing:
      type: object
      properties:
        kind: { type: string, enum: [do, dont] }
        time: { type: [string, 'null'], example: '07:30' }
        title: { type: string }
        detail: { type: string }
        condition: { oneOf: [{ $ref: '#/components/schemas/ConditionTag' }, { type: 'null' }] }
    Habit:
      type: object
      properties:
        icon: { type: string }
        title: { type: string }
        detail: { type: string }
        condition: { oneOf: [{ $ref: '#/components/schemas/ConditionTag' }, { type: 'null' }] }
    ConditionDetail:
      allOf:
        - $ref: '#/components/schemas/ConditionTag'
        - type: object
          properties:
            image: { type: [string, 'null'] }
            summary: { type: string }
            foods:
              type: object
              properties:
                avoid: { type: array, items: { $ref: '#/components/schemas/FoodItem' } }
                limit: { type: array, items: { $ref: '#/components/schemas/FoodItem' } }
                ok: { type: array, items: { $ref: '#/components/schemas/FoodItem' } }
                recommended: { type: array, items: { $ref: '#/components/schemas/FoodItem' } }
            timing: { type: array, items: { $ref: '#/components/schemas/Timing' } }
            habits: { type: array, items: { $ref: '#/components/schemas/Habit' } }
            sources: { type: array, items: { $ref: '#/components/schemas/Source' } }
    FoodSearch:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        image: { type: [string, 'null'] }
        cutout: { type: [string, 'null'], description: 'the same food as a transparent image (no background)' }
        origin: { type: string, enum: [local, imported] }
        season: { type: array, items: { type: integer } }
        in_season: { type: boolean }
        category: { type: string }
        verdicts:
          type: array
          items: { type: object, properties: { condition: { type: string }, verdict: { $ref: '#/components/schemas/Verdict' }, reason: { type: string } } }
    PlanRequest:
      type: object
      required: [age, gender]
      properties:
        country: { type: string, default: BD }
        age: { type: integer, minimum: 1, maximum: 120 }
        gender: { $ref: '#/components/schemas/Gender' }
        conditions: { type: array, maxItems: 6, items: { type: string }, example: [diabetes, insomnia] }
        criteria: { $ref: '#/components/schemas/Criteria' }
    PlanFood:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        image: { type: [string, 'null'] }
        category: { type: string }
        verdict: { $ref: '#/components/schemas/Verdict' }
        conflict: { type: boolean, description: 'A restriction overrode a recommendation from another condition' }
        why: { $ref: '#/components/schemas/Why' }
        cost: { type: [integer, 'null'], minimum: 1, maximum: 3, description: 'Rough cost band 1 (everyday) to 3 (costly)' }
        reasons:
          type: array
          items: { type: object, properties: { condition: { type: string }, color: { type: string }, verdict: { $ref: '#/components/schemas/Verdict' }, reason: { type: string } } }
    Plan:
      type: object
      properties:
        profile:
          type: object
          properties:
            country: { type: string }
            age: { type: integer }
            age_group: { $ref: '#/components/schemas/AgeGroup' }
            gender: { $ref: '#/components/schemas/Gender' }
            conditions: { type: array, items: { $ref: '#/components/schemas/ConditionTag' } }
        meals:
          type: array
          items:
            type: object
            properties:
              slug: { type: string }
              name: { type: string }
              time: { type: string }
              image: { type: [string, 'null'] }
              items: { type: array, items: { type: object, properties: { slug: { type: string }, name: { type: string }, verdict: { $ref: '#/components/schemas/Verdict' } } } }
        foods:
          type: object
          properties:
            avoid: { type: array, items: { $ref: '#/components/schemas/PlanFood' } }
            limit: { type: array, items: { $ref: '#/components/schemas/PlanFood' } }
            recommended: { type: array, items: { $ref: '#/components/schemas/PlanFood' } }
        timing:
          type: object
          properties:
            do: { type: array, items: { $ref: '#/components/schemas/Timing' } }
            dont: { type: array, items: { $ref: '#/components/schemas/Timing' } }
        habits: { type: array, items: { $ref: '#/components/schemas/Habit' } }
        notes: { type: array, items: { type: string } }
        sources: { type: array, items: { $ref: '#/components/schemas/Source' } }
        insights:
          type: array
          description: 'What the extra criteria say (empty when none were given): where a value sits against its published range, in words, cited. A pointer to a condition page, never a diagnosis.'
          items: { $ref: '#/components/schemas/Insight' }
    Why:
      type: object
      description: 'The one reason that decided a verdict'
      properties:
        basis: { type: string, enum: [condition, allergy] }
        rule_id: { type: [integer, 'null'] }
        condition: { type: [object, 'null'], description: 'The condition that won' }
        allergen: { type: [string, 'null'], enum: [milk, egg, peanut, tree_nut, gluten, soy, fish, shellfish, sesame, null] }
        reason: { type: string }
        source: { type: [object, 'null'], description: 'The rule''s own source, else the first source of its condition' }
        reviewed_on: { type: [string, 'null'] }
        also: { type: integer, description: 'How many other conditions also had a say' }
    Insight:
      type: object
      properties:
        criterion: { type: string, enum: [bmi, waist, activity, sleep, hba1c, fasting_glucose, blood_pressure, hemoglobin] }
        band: { type: string, enum: [low, typical, raised, high] }
        value: { type: string, example: 'BMI 27.1' }
        title: { type: string }
        detail: { type: string }
        source: { type: [object, 'null'] }
        suggests: { type: [object, 'null'] }
    Criteria:
      type: object
      description: 'Optional extra inputs of POST /plan and of a profile. BMI uses WHO classes (25 / 30), or the WHO Asian action points (23 / 27.5) for BD, IN, PK, LK, NP; waist uses the IDF limits (South Asian 90 cm men / 80 cm women); sleep and activity follow AASM/SRS and WHO; labs follow ADA, WHO and WHO haemoglobin thresholds. Children get no BMI.'
      properties:
        height_cm: { type: integer }
        weight_kg: { type: number }
        waist_cm: { type: integer }
        activity: { type: string, enum: [sedentary, light, moderate, active] }
        sleep_hours: { type: number }
        allergens: { type: array, items: { type: string, enum: [milk, egg, peanut, tree_nut, gluten, soy, fish, shellfish, sesame] }, description: 'Foods carrying them are forced to avoid (why.basis allergy) and leave meals' }
        budget: { type: string, enum: [low, medium, high], description: 'Orders suggestions cheaper first; low drops the costliest. Never changes a verdict.' }
        labs: { type: array, items: { type: object, properties: { kind: { type: string }, value: { type: number } } }, description: 'Oldest first; the latest of each kind is read' }
        pregnancy: { type: string, enum: [none, pregnant, breastfeeding] }
    RuleUpsert:
      type: object
      required: [condition, food, verdict, reason]
      properties:
        condition: { type: string }
        food: { type: string }
        verdict: { $ref: '#/components/schemas/Verdict' }
        reason: { $ref: '#/components/schemas/Text' }
        source: { type: string, description: 'Key of the cited source; absent = leave the citation. Saving a rule clears its review.' }
    FoodCreate:
      type: object
      required: [slug, category, name]
      properties:
        slug: { type: string, pattern: '^[a-z0-9-]{2,60}$' }
        category: { type: string }
        name: { $ref: '#/components/schemas/Text' }
    ConditionPatch:
      type: object
      properties:
        name: { $ref: '#/components/schemas/Text' }
        summary: { $ref: '#/components/schemas/Text' }
        icon: { type: string }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        media_id: { type: integer, description: 'Zero clears the cover' }
        active: { type: boolean }
    Media:
      type: object
      properties:
        id: { type: integer }
        url: { type: string, example: /media/7 }
        status: { type: string, enum: [pending, stored, failed] }
        source: { type: [string, 'null'], example: pexels }
        license: { type: [string, 'null'] }
        source_url: { type: [string, 'null'] }
        widths: { type: array, items: { type: integer } }
        bytes: { type: integer }
    Nutrients:
      type: object
      description: 'Per 100 g; null when the source does not report it'
      properties:
        kcal: { type: [number, 'null'] }
        protein_g: { type: [number, 'null'] }
        fat_g: { type: [number, 'null'] }
        carb_g: { type: [number, 'null'] }
        fibre_g: { type: [number, 'null'] }
        sugar_g: { type: [number, 'null'] }
        sat_fat_g: { type: [number, 'null'] }
        sodium_mg: { type: [number, 'null'] }
        potassium_mg: { type: [number, 'null'] }
        iron_mg: { type: [number, 'null'] }
        calcium_mg: { type: [number, 'null'] }
    FoodVariant:
      type: object
      properties:
        slug: { type: string, example: breast }
        name: { type: string, example: 'Breast, skinless, roasted' }
        is_default: { type: boolean }
        per_100g: { $ref: '#/components/schemas/Nutrients' }
        source: { type: string, example: 'USDA FoodData Central #171477' }
        source_url: { type: [string, 'null'] }
        method: { type: [string, 'null'], enum: [raw, boiled, poached, steamed, stewed, dry_heat, roasted, baked, scrambled, omelette, mashed, fried, deep_fried, null] }
        fat: { type: [string, 'null'], enum: [none, little, added, deep, null], description: 'fat the cooking adds' }
        versus_default: { type: [object, 'null'], properties: { kcal: { type: number }, fat_g: { type: number } }, description: 'per 100 g against the plain (default) variant' }
        verdicts: { type: array, description: 'conditions stricter about this way of cooking (sourced)', items: { type: object, properties: { condition: { type: object }, verdict: { type: string, enum: [avoid, limit, ok, recommended] }, reason: { type: string }, source: { type: [object, 'null'] } } } }
    FoodDetail:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        image: { type: [string, 'null'] }
        cutout: { type: [string, 'null'], description: 'the same food as a transparent image (no background)' }
        origin: { type: string, enum: [local, imported] }
        season: { type: array, items: { type: integer, minimum: 1, maximum: 12 } }
        in_season: { type: boolean }
        variants: { type: array, items: { $ref: '#/components/schemas/FoodVariant' } }
        best_way: { type: [string, 'null'], description: 'slug of the lightest way to cook it (least added fat, then fewest calories)' }
        glycemic: { oneOf: [{ $ref: '#/components/schemas/Glycemic' }, { type: 'null' }] }
        category: { type: object, properties: { slug: { type: string }, name: { type: string }, image: { type: [string, 'null'] } } }
        verdicts: { type: array, items: { type: object, properties: { condition: { $ref: '#/components/schemas/ConditionTag' }, verdict: { $ref: '#/components/schemas/Verdict' }, reason: { type: string } } } }
        meal_slots: { type: array, items: { type: object } }
        swaps: { type: array, items: { type: object, properties: { slug: { type: string }, name: { type: string }, image: { type: [string, 'null'] }, recommended_for: { type: integer } } } }
        sources: { type: array, items: { $ref: '#/components/schemas/Source' } }
    Source:
      type: object
      description: 'Guideline or patient-information page behind the guidance; condition sources first, then general ones'
      properties:
        title: { type: string }
        publisher: { type: string }
        url: { type: [string, 'null'] }
        year: { type: [integer, 'null'] }
    Saved:
      type: object
      properties: { id: { type: integer } }
    SyncHeader:
      type: object
      properties: { name: { type: string }, value: { type: string, description: 'empty for a secret header' }, secret: { type: boolean } }
    SyncSource:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        kind: { type: string, enum: [medicines, foods, conditions, allergies, custom] }
        base_url: { type: string, description: 'http or https only; loopback, link-local and private addresses are refused after DNS resolution' }
        method: { type: string, enum: [get, post] }
        headers: { type: array, items: { $ref: '#/components/schemas/SyncHeader' } }
        query_template: { type: string, description: 'GET: the query string; POST: the body. {today} = the date' }
        timeout_ms: { type: integer, minimum: 500, maximum: 120000 }
        max_retries: { type: integer, minimum: 0, maximum: 10 }
        backoff_base_ms: { type: integer }
        backoff_factor: { type: number, minimum: 1, maximum: 10 }
        backoff_max_ms: { type: integer }
        jitter: { type: boolean }
        schedule_hours: { type: [integer, 'null'], description: 'null = by hand' }
        active: { type: boolean }
        last_run_at: { type: [integer, 'null'], description: unix seconds }
        last_status: { type: [string, 'null'], enum: [running, ok, failed, null] }
        last_error: { type: [string, 'null'] }
        can_save: { type: boolean, description: 'false = the kind has no mapper yet' }
    SyncSetup:
      type: object
      properties: { sources: { type: array, items: { $ref: '#/components/schemas/SyncSource' } }, vault_ready: { type: boolean } }
    SyncSourceInput:
      type: object
      properties:
        slug: { type: string, description: 'create only' }
        name: { type: string }
        kind: { type: string, enum: [medicines, foods, conditions, allergies, custom] }
        base_url: { type: string }
        method: { type: string, enum: [get, post] }
        headers: { type: array, items: { type: object, required: [name, value, secret], properties: { name: { type: string }, value: { type: string }, secret: { type: boolean } } } }
        query_template: { type: string }
        timeout_ms: { type: integer }
        max_retries: { type: integer }
        backoff_base_ms: { type: integer }
        backoff_factor: { type: number }
        backoff_max_ms: { type: integer }
        jitter: { type: boolean }
        schedule_hours: { type: [integer, 'null'] }
        active: { type: boolean }
    SyncTest:
      type: object
      properties: { ok: { type: boolean }, error: { type: [string, 'null'] }, elapsed_ms: { type: integer }, rows_seen: { type: integer }, rows_usable: { type: integer }, can_save: { type: boolean }, sample: { type: array, items: { type: string } } }
    SyncRun:
      type: object
      properties:
        id: { type: integer }
        source: { type: string }
        source_name: { type: string }
        started_by: { type: string, enum: [manual, schedule] }
        started_at: { type: integer, description: unix seconds }
        finished_at: { type: [integer, 'null'] }
        attempts: { type: integer, description: 'requests made: 1 + retries used' }
        status: { type: string, enum: [running, ok, failed] }
        rows_seen: { type: integer }
        rows_created: { type: integer }
        rows_updated: { type: integer }
        rows_skipped: { type: integer }
        error: { type: [string, 'null'] }
