# Dev overlay: Vite with hot reload on http://127.0.0.1:5180, proxying /api to the app container.
services:
  web:
    image: ${NODE_IMAGE:-node:24-alpine}
    working_dir: /web
    command: sh -c "npm ci --no-audit --no-fund && npx vite --host 0.0.0.0 --port 5180"
    environment:
      API_PROXY: http://app:8080
    volumes:
      - ../codes/frontend:/web
      - web_modules:/web/node_modules
    ports:
      - "127.0.0.1:${WEB_PORT:-5180}:5180"
    depends_on: [app]

volumes:
  web_modules: {}
