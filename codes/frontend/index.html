<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Diet, timing and lifestyle guidance for asthma, diabetes, fatty liver, migraine, thyroid and insomnia — Bangladesh first." />
    <meta name="theme-color" content="#f0f1f5" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" as="fetch" href="/api/v1/bootstrap?lang=en" crossorigin />
    <title>Pathya — food that fits you</title>
    <script src="/theme.js"></script>
  </head>
  <body>
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position: absolute">
      <!-- Glass refraction for the few small floating layers (tab bar, menu sheet) in Chromium: a soft noise bends what is behind them. -->
      <filter id="lens-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.011 0.018" numOctaves="1" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <img src="/favicon.svg" alt="" width="56" height="56" />
        <p>Pathya · পথ্য</p>
      </div>
    </div>
    <noscript>Pathya needs JavaScript to build your plan. · প্ল্যান তৈরি করতে জাভাস্ক্রিপ্ট চালু করুন।</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
